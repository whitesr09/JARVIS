name: Build Zara AI APK

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
          cache-provider: basic

      - name: Prepare permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ZARA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zara-signing.p12"
            echo "ZARA_KEYSTORE_PATH=$RUNNER_TEMP/zara-signing.p12" >> "$GITHUB_ENV"
            echo "Signing with the permanent Zara key."
          else
            echo "::warning::ZARA_KEYSTORE_B64 secret not set - this APK gets a temporary key and cannot update an installed build in place."
          fi

      - name: Build debug APK
        env:
          ZARA_KEY_PASSWORD: ${{ secrets.ZARA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Show signing certificate fingerprint
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-256|Signer #1 certificate DN" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zara-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Runs after the APK is uploaded so a test failure is visible (red run) without hiding the build output.
      - name: Run unit tests
        run: gradle --no-daemon test
